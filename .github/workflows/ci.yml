name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -c "import py_compile, os, sys
          errs = []
          for root, _, files in os.walk('.'):
            for f in files:
              if f.endswith('.py') and '.venv' not in root and 'site-packages' not in root:
                try: py_compile.compile(os.path.join(root,f), doraise=True)
                except py_compile.PyCompileError as e: errs.append(str(e))
          if errs:
            print('\\n'.join(errs))
            sys.exit(1)
          print('All syntax OK')"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/NJFU-
            git pull origin main
            docker compose -f deploy/docker-compose.yml up -d --build
