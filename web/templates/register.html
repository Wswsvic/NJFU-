{% extends "base.html" %}
{% block title %}注册 - 座位预约{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">注册</h3>
                <div id="error-alert" class="alert alert-danger text-center" style="display: none;" role="alert"></div>
                <form method="post" action="/njfu.reserve.seat/api/register" id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">学号</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">图书馆密码</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱（可选）</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="pushplus_token" class="form-label">PushPlus Token（可选，用于接收通知）</label>
                        <input type="text" class="form-control" id="pushplus_token" name="pushplus_token">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="submit-btn" autocomplete="off">注册</button>
                    </div>
                    <p class="text-center mt-3 mb-0">
                        已有账号？<a href="/njfu.reserve.seat/login">去登录</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault(); // 阻止浏览器默认跳转提交

    const form = e.target;
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    // 隐藏之前的错误信息
    errorAlert.style.display = 'none';

    // 切换按钮为加载状态（因为后台开了无头浏览器登录，可能需要几秒到十几秒）
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 正在连接校园网验证账号密码...请稍候';

    try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            // fetch 默认会跟随 302 重定向
            redirect: 'follow'
        });

        if (response.ok) {
            // 后端最后通过 RedirectResponse 跳转到了 /login，response.ok 为 true
            // 或者直接让前端控制跳转：
            window.location.href = '/njfu.reserve.seat/login';
        } else {
            // 解析 400 等报错信息 (FastAPI HTTPException 的格式: {"detail": "报错内容"})
            const data = await response.json();
            errorAlert.textContent = data.detail || '验证失败，请检查账号密码或网络连接';
            errorAlert.style.display = 'block';

            // 恢复按钮
            submitBtn.disabled = false;
            submitBtn.innerHTML = '注册';
        }
    } catch (err) {
        errorAlert.textContent = '请求发生异常：' + err.message;
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '注册';
    }
});
</script>
{% endblock %}
