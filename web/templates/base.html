<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}图书馆座位预约{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .navbar-brand { font-weight: bold; }
        table th { background: #e9ecef; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/njfu.reserve.seat/">座位预约</a>
            {% if user %}
            <div class="d-flex">
                <span class="navbar-text me-3 text-white">{{ user.username }}</span>
                <form method="post" action="/njfu.reserve.seat/api/logout" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">退出</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
