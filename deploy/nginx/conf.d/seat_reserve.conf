upstream seat_backend {
    server seat_reserve_web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    access_log /var/log/nginx/seat_access.log;
    error_log /var/log/nginx/seat_error.log;
    
    client_max_body_size 10M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 10;
    
    # 根路径 - 直接代理到 FastAPI，让它处理
    location = / {
        proxy_pass http://seat_backend/njfu.reserve.seat/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 隐藏接口
    location /docs { deny all; }
    location /openapi.json { deny all; return 404; }
    location /njfu.reserve.seat/docs { deny all; }
    location /njfu.reserve.seat/openapi.json { deny all; return 404; }
    
    # 主要代理
    location /njfu.reserve.seat/ {
        proxy_pass http://seat_backend/njfu.reserve.seat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /njfu.reserve.seat;
        proxy_buffering off;
        proxy_cache off;
    }
    
    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /njfu.reserve.seat/health {
        proxy_pass http://seat_backend/njfu.reserve.seat/health;
        access_log off;
    }
}
