services:
  # FastAPI 应用
  seat_reserve_web:
    build: 
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: njfu_seat_reserve
    restart: always
    mem_limit: 2g
    shm_size: 256m
    ports:
      - "127.0.0.1:8000:8000"   # 仅绑定本地回环，由宿主机 nginx 代理
    volumes:
      - ../data:/app/data       # 映射 data 目录，持久化用户数据和预约计划
      - ../get_API:/app/get_API # 映射 get_API 目录，持久化 API 响应缓存
      - ../debug:/app/debug     # 映射 debug 目录，持久化操作日志
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1    # 禁用 stdout 缓冲，确保 docker logs -f 实时输出
      
      # 告诉 Uvicorn 它在代理后面
      - FORWARDED_ALLOW_IPS=*
      - PROXY_HEADERS=True
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
